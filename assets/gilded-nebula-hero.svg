<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Mujtaba — Gilded Nebula</title>
  <desc id="desc">Animated navy galaxy with neon-purple nebulae, golden orbital light and a glass identity panel.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020317"/>
      <stop offset=".52" stop-color="#071238"/>
      <stop offset="1" stop-color="#13052d"/>
    </linearGradient>
    <radialGradient id="purpleCloud">
      <stop stop-color="#d43cff" stop-opacity=".72"/>
      <stop offset=".34" stop-color="#8d22ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4215a7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldCloud">
      <stop stop-color="#ffe69b" stop-opacity=".55"/>
      <stop offset=".3" stop-color="#f0ad38" stop-opacity=".22"/>
      <stop offset="1" stop-color="#b76f08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun">
      <stop stop-color="#fff7cf"/>
      <stop offset=".18" stop-color="#ffe08a"/>
      <stop offset=".56" stop-color="#f0a72f"/>
      <stop offset="1" stop-color="#8d3d16"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a96b18"/>
      <stop offset=".28" stop-color="#ffe293"/>
      <stop offset=".55" stop-color="#f4bb4d"/>
      <stop offset=".82" stop-color="#fff0b7"/>
      <stop offset="1" stop-color="#b87519"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset=".45" stop-color="#af75ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#f6c35b" stop-opacity=".06"/>
    </linearGradient>
    <pattern id="stars" width="150" height="110" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.2" fill="#fff7d4" opacity=".9"/>
      <circle cx="61" cy="36" r=".7" fill="#d7b5ff" opacity=".76"/>
      <circle cx="112" cy="17" r=".9" fill="#fff" opacity=".72"/>
      <circle cx="140" cy="68" r="1.1" fill="#ffd972" opacity=".8"/>
      <circle cx="83" cy="91" r=".55" fill="#fff" opacity=".58"/>
      <circle cx="31" cy="100" r=".75" fill="#c68cff" opacity=".78"/>
    </pattern>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dy="20" stdDeviation="22" flood-color="#000017" flood-opacity=".82"/></filter>
    <clipPath id="clip"><rect width="1200" height="500" rx="34"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="500" fill="url(#night)"/>
    <ellipse cx="290" cy="160" rx="350" ry="230" fill="url(#purpleCloud)" filter="url(#blur)">
      <animate attributeName="rx" values="320;390;320" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".65;1;.65" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1035" cy="315" rx="320" ry="210" fill="url(#goldCloud)" filter="url(#blur)">
      <animate attributeName="ry" values="185;245;185" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-150" width="1500" height="600" fill="url(#stars)" opacity=".78">
      <animateTransform attributeName="transform" type="translate" values="0 0;150 0" dur="46s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(1000 250)">
      <circle r="82" fill="url(#sun)" filter="url(#glow)"/>
      <circle r="118" fill="none" stroke="#f7c758" stroke-width="1.5" stroke-dasharray="4 12" opacity=".68">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle r="157" fill="none" stroke="#bc52ff" stroke-width="1" stroke-dasharray="2 14" opacity=".55">
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="38s" repeatCount="indefinite"/>
      </circle>
      <ellipse rx="196" ry="54" fill="none" stroke="url(#gold)" stroke-width="3" transform="rotate(-18)" opacity=".84"/>
      <circle cx="-162" cy="57" r="7" fill="#d871ff" filter="url(#glow)">
        <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g filter="url(#shadow)">
      <rect x="64" y="58" width="720" height="382" rx="30" fill="#060a25" fill-opacity=".58" stroke="url(#gold)" stroke-opacity=".82"/>
      <rect x="76" y="70" width="696" height="358" rx="24" fill="url(#glass)" stroke="#d38cff" stroke-opacity=".28"/>
    </g>
    <path d="M105 109H326" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="105" cy="109" r="5" fill="#ffd66f" filter="url(#glow)">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="124" y="115" fill="#f9d777" font-family="JetBrains Mono,Consolas,monospace" font-size="14" letter-spacing="3">GILDED ORBIT / NODE 01</text>
    <text x="104" y="207" fill="#fff9e8" font-family="Inter,Segoe UI,sans-serif" font-size="76" font-weight="800" letter-spacing="3">MUJTABA</text>
    <text x="108" y="252" fill="url(#gold)" font-family="JetBrains Mono,Consolas,monospace" font-size="23" font-weight="700" letter-spacing="6">AI SYSTEMS ARCHITECT</text>
    <text x="108" y="303" fill="#d9c7f2" font-family="Inter,Segoe UI,sans-serif" font-size="18">Local intelligence. Real tools. Governed autonomy.</text>

    <g transform="translate(108 341)">
      <rect width="176" height="46" rx="23" fill="#160f38" fill-opacity=".78" stroke="#d34cff" stroke-opacity=".72"/>
      <circle cx="23" cy="23" r="5" fill="#d952ff" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="40" y="29" fill="#f0d7ff" font-family="JetBrains Mono,Consolas,monospace" font-size="12" letter-spacing="1.3">SYSTEM ONLINE</text>
    </g>
    <g transform="translate(300 341)">
      <rect width="162" height="46" rx="23" fill="#1d1732" fill-opacity=".78" stroke="#f3c454" stroke-opacity=".65"/>
      <text x="22" y="29" fill="#ffe7a2" font-family="JetBrains Mono,Consolas,monospace" font-size="12" letter-spacing="1.3">LOCAL-FIRST</text>
    </g>
    <g transform="translate(478 341)">
      <rect width="192" height="46" rx="23" fill="#111331" fill-opacity=".78" stroke="#9f62ff" stroke-opacity=".66"/>
      <text x="22" y="29" fill="#dcc9ff" font-family="JetBrains Mono,Consolas,monospace" font-size="12" letter-spacing="1.3">HUMAN-GOVERNED</text>
    </g>

    <rect x="0" y="0" width="1200" height="500" rx="34" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <rect x="10" y="10" width="1180" height="480" rx="27" fill="none" stroke="#c44fff" stroke-opacity=".16"/>
    <rect x="0" y="-45" width="1200" height="34" fill="#f7cf68" opacity=".045"><animate attributeName="y" values="-45;530" dur="8s" repeatCount="indefinite"/></rect>
  </g>
</svg>

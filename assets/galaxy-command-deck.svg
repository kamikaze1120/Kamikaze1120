<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Mujtaba AI Systems Command Deck</title>
  <desc id="desc">Animated science-fiction galaxy interface with glass panels, orbital telemetry and system status.</desc>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02030b"/>
      <stop offset="0.48" stop-color="#090d22"/>
      <stop offset="1" stop-color="#030611"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6737ff" stop-opacity=".52"/>
      <stop offset=".45" stop-color="#2546d8" stop-opacity=".19"/>
      <stop offset="1" stop-color="#081023" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00d9ff" stop-opacity=".35"/>
      <stop offset=".42" stop-color="#0088ff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#001426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bdcff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#6c7dff" stop-opacity=".065"/>
      <stop offset="1" stop-color="#ac5cff" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8ff" stop-opacity=".85"/>
      <stop offset=".48" stop-color="#5577ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#b15cff" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8ff"/>
      <stop offset=".48" stop-color="#75a7ff"/>
      <stop offset="1" stop-color="#bd7cff"/>
    </linearGradient>
    <radialGradient id="planet" cx="34%" cy="28%" r="72%">
      <stop offset="0" stop-color="#b9f4ff"/>
      <stop offset=".16" stop-color="#3ac7ff"/>
      <stop offset=".48" stop-color="#3845b8"/>
      <stop offset=".82" stop-color="#15113e"/>
      <stop offset="1" stop-color="#050611"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#61c9ff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <pattern id="stars" width="170" height="130" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1" fill="#fff" opacity=".85"/>
      <circle cx="58" cy="41" r=".7" fill="#8ee8ff" opacity=".7"/>
      <circle cx="119" cy="16" r="1.2" fill="#d5c9ff" opacity=".8"/>
      <circle cx="155" cy="72" r=".65" fill="#fff" opacity=".58"/>
      <circle cx="86" cy="103" r=".8" fill="#7fdcff" opacity=".76"/>
      <circle cx="31" cy="116" r=".55" fill="#fff" opacity=".5"/>
      <circle cx="140" cy="121" r=".45" fill="#d0b6ff" opacity=".62"/>
    </pattern>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00071d" flood-opacity=".85"/>
    </filter>
    <clipPath id="frameClip"><rect width="1200" height="480" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="480" fill="url(#space)"/>
    <rect width="1200" height="480" fill="url(#grid)"/>

    <ellipse cx="235" cy="235" rx="310" ry="250" fill="url(#nebulaA)" filter="url(#blur40)">
      <animate attributeName="rx" values="290;345;290" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1010" cy="155" rx="310" ry="230" fill="url(#nebulaB)" filter="url(#blur40)">
      <animate attributeName="ry" values="210;260;210" dur="14s" repeatCount="indefinite"/>
    </ellipse>

    <g opacity=".72">
      <rect x="-170" width="1540" height="610" fill="url(#stars)">
        <animateTransform attributeName="transform" type="translate" values="0 0;170 0" dur="38s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity=".34" transform="scale(1.35)">
      <rect x="-170" width="1180" height="430" fill="url(#stars)">
        <animateTransform attributeName="transform" type="translate" values="0 0;-170 0" dur="64s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g opacity=".9" filter="url(#glow)">
      <path d="M-110 116 L90 22" stroke="#bdefff" stroke-width="2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="translate" values="0 0;1320 390" dur="7.5s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="1s" repeatCount="indefinite"/>
      </path>
    </g>

    <g transform="translate(935 236)" opacity=".92">
      <ellipse rx="202" ry="76" fill="none" stroke="#72d9ff" stroke-opacity=".32" stroke-width="1.2" transform="rotate(-18)"/>
      <ellipse rx="168" ry="58" fill="none" stroke="#9a75ff" stroke-opacity=".22" stroke-width="1" transform="rotate(21)"/>
      <circle r="92" fill="url(#planet)" filter="url(#shadow)"/>
      <path d="M-85 -23 C-20 -54 43 -50 88 -14" fill="none" stroke="#9feaff" stroke-opacity=".29" stroke-width="4"/>
      <path d="M-94 8 C-42 -12 31 7 79 34" fill="none" stroke="#8f78ff" stroke-opacity=".25" stroke-width="7"/>
      <ellipse rx="205" ry="42" fill="none" stroke="url(#cyanViolet)" stroke-width="3" stroke-opacity=".7" transform="rotate(-14)"/>
      <circle r="118" fill="none" stroke="#6ee7ff" stroke-width="1" stroke-dasharray="3 13" opacity=".42">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle cx="103" cy="-58" r="4" fill="#a8f5ff" filter="url(#glow)">
        <animate attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g filter="url(#shadow)">
      <rect x="58" y="52" width="700" height="350" rx="26" fill="#071021" fill-opacity=".46" stroke="url(#edge)" stroke-width="1.2"/>
      <rect x="72" y="66" width="672" height="322" rx="20" fill="url(#glass)" stroke="#b6ecff" stroke-opacity=".10"/>
    </g>

    <path d="M91 93 H280" stroke="url(#cyanViolet)" stroke-width="2"/>
    <circle cx="91" cy="93" r="4" fill="#6ee7ff" filter="url(#glow)">
      <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="106" y="99" fill="#8edfff" font-family="JetBrains Mono,Consolas,monospace" font-size="13" letter-spacing="2.2">COMMAND DECK / 01</text>

    <text x="95" y="171" fill="#f0f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="64" font-weight="750" letter-spacing="2">MUJTABA</text>
    <text x="99" y="211" fill="url(#cyanViolet)" font-family="JetBrains Mono,Consolas,monospace" font-size="21" font-weight="600" letter-spacing="5">AI SYSTEMS ENGINEER</text>
    <text x="98" y="252" fill="#a7bbd7" font-family="Inter,Segoe UI,sans-serif" font-size="17" letter-spacing=".5">LOCAL-FIRST AGENTS · MCP INFRASTRUCTURE · INTELLIGENCE INTERFACES</text>

    <g transform="translate(98 285)">
      <rect width="168" height="42" rx="12" fill="#071527" fill-opacity=".72" stroke="#55dfff" stroke-opacity=".42"/>
      <circle cx="20" cy="21" r="5" fill="#58f3bc" filter="url(#glow)">
        <animate attributeName="opacity" values=".3;1;.3" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="26" fill="#c8fdf0" font-family="JetBrains Mono,Consolas,monospace" font-size="12" letter-spacing="1.5">SYSTEM ONLINE</text>
    </g>
    <g transform="translate(280 285)">
      <rect width="175" height="42" rx="12" fill="#0d1028" fill-opacity=".72" stroke="#8378ff" stroke-opacity=".43"/>
      <text x="18" y="26" fill="#d8d2ff" font-family="JetBrains Mono,Consolas,monospace" font-size="12" letter-spacing="1.2">LOCAL // SECURE</text>
    </g>
    <g transform="translate(469 285)">
      <rect width="193" height="42" rx="12" fill="#150d28" fill-opacity=".72" stroke="#bb72ff" stroke-opacity=".42"/>
      <text x="18" y="26" fill="#ebd6ff" font-family="JetBrains Mono,Consolas,monospace" font-size="12" letter-spacing="1.2">BUILDING // ACTIVE</text>
    </g>

    <g transform="translate(98 354)">
      <text y="0" fill="#7290b1" font-family="JetBrains Mono,Consolas,monospace" font-size="11" letter-spacing="2">SIGNAL</text>
      <rect x="72" y="-9" width="485" height="8" rx="4" fill="#0c1830"/>
      <rect x="72" y="-9" width="390" height="8" rx="4" fill="url(#cyanViolet)">
        <animate attributeName="width" values="350;485;390;460;350" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g opacity=".55">
      <path d="M790 76 V404" stroke="#72dbff" stroke-opacity=".24" stroke-dasharray="2 8"/>
      <text x="810" y="92" fill="#7fb4d1" font-family="JetBrains Mono,Consolas,monospace" font-size="10" letter-spacing="2">ORBITAL TELEMETRY</text>
      <text x="810" y="111" fill="#58728f" font-family="JetBrains Mono,Consolas,monospace" font-size="9">SECTOR 11-A / DEEP FIELD</text>
    </g>

    <rect x="0" y="0" width="1200" height="480" fill="none" stroke="url(#edge)" stroke-width="2" rx="28"/>
    <rect x="8" y="8" width="1184" height="464" fill="none" stroke="#8ce7ff" stroke-opacity=".08" rx="22"/>

    <rect x="0" y="-50" width="1200" height="38" fill="#8cecff" opacity=".035">
      <animate attributeName="y" values="-50;510" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

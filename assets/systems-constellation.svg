<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
  <title id="title">Six-system constellation</title>
  <desc id="desc">Six perfectly aligned glass cards connected by a gold and neon-purple constellation spine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03051b"/><stop offset=".52" stop-color="#071438"/><stop offset="1" stop-color="#13072c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9b6014"/><stop offset=".28" stop-color="#ffe59a"/><stop offset=".6" stop-color="#f4bc4d"/><stop offset="1" stop-color="#b26d15"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff55e8"/><stop offset=".45" stop-color="#bd38ff"/><stop offset="1" stop-color="#6c35ff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".12"/><stop offset=".46" stop-color="#9e65ff" stop-opacity=".075"/><stop offset="1" stop-color="#f0b83f" stop-opacity=".055"/></linearGradient>
    <radialGradient id="glowP"><stop stop-color="#b92fff" stop-opacity=".46"/><stop offset="1" stop-color="#7b1aff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowG"><stop stop-color="#ffd36a" stop-opacity=".35"/><stop offset="1" stop-color="#d6901c" stop-opacity="0"/></radialGradient>
    <pattern id="stars" width="138" height="96" patternUnits="userSpaceOnUse"><circle cx="12" cy="16" r=".8" fill="#ffe8a7"/><circle cx="72" cy="38" r=".55" fill="#d9acff"/><circle cx="119" cy="14" r=".65" fill="#fff"/><circle cx="35" cy="78" r=".45" fill="#fff"/><circle cx="103" cy="82" r=".7" fill="#c463ff"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dy="14" stdDeviation="16" flood-color="#000018" flood-opacity=".72"/></filter>
    <clipPath id="clip"><rect width="1200" height="870" rx="32"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="870" fill="url(#bg)"/>
    <circle cx="150" cy="200" r="260" fill="url(#glowP)" filter="url(#blur)" opacity=".65"/>
    <circle cx="1050" cy="650" r="290" fill="url(#glowG)" filter="url(#blur)" opacity=".62"/>
    <rect width="1200" height="870" fill="url(#stars)" opacity=".24"/>

    <text x="600" y="50" text-anchor="middle" fill="#f9d46e" font-family="JetBrains Mono,Consolas,monospace" font-size="13" letter-spacing="4">SELECTED SYSTEMS / CONSTELLATION 06</text>
    <text x="600" y="82" text-anchor="middle" fill="#fdf6ff" font-family="Inter,Segoe UI,sans-serif" font-size="26" font-weight="700" letter-spacing="1">Six builds. One operating philosophy.</text>

    <path d="M600 118V812" stroke="#aa71ff" stroke-opacity=".23" stroke-width="2" stroke-dasharray="3 11"/>
    <path d="M600 212H570 M600 212H630 M600 452H570 M600 452H630 M600 692H570 M600 692H630" stroke="url(#gold)" stroke-width="2" opacity=".7"/>
    <g fill="#ffd369" filter="url(#glow)">
      <circle cx="600" cy="212" r="6"><animate attributeName="r" values="4;8;4" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="452" r="6"><animate attributeName="r" values="4;8;4" dur="2.8s" begin=".8s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="692" r="6"><animate attributeName="r" values="4;8;4" dur="2.8s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>
    <circle cx="600" cy="125" r="3" fill="#dc54ff"><animate attributeName="cy" values="125;810" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/></circle>

    <!-- row 1 -->
    <g transform="translate(50 112)" filter="url(#shadow)">
      <rect width="520" height="200" rx="24" fill="#080d2b" fill-opacity=".76" stroke="#f1be50" stroke-opacity=".66"/>
      <rect x="10" y="10" width="500" height="180" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".08"/>
      <path d="M24 25H210" stroke="url(#gold)" stroke-width="3"/>
      <text x="28" y="55" fill="#f5c85f" font-family="JetBrains Mono,Consolas,monospace" font-size="13" letter-spacing="2">01 / AGENT CORE</text>
      <text x="28" y="91" fill="#fffaf0" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="750">R2D2 AI Agent</text>
      <text x="28" y="122" fill="#c8c4df" font-family="Inter,Segoe UI,sans-serif" font-size="14">Local AI butler with voice, memory and</text>
      <text x="28" y="143" fill="#c8c4df" font-family="Inter,Segoe UI,sans-serif" font-size="14">autonomous business workflows.</text>
      <text x="28" y="174" fill="#d69aff" font-family="JetBrains Mono,Consolas,monospace" font-size="11">PYTHON  ·  OLLAMA  ·  SUPABASE</text>
      <circle cx="458" cy="62" r="26" fill="none" stroke="#d744ff" stroke-width="2" stroke-dasharray="5 7"><animateTransform attributeName="transform" type="rotate" values="0 458 62;360 458 62" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="458" cy="62" r="8" fill="#f1c55c" filter="url(#glow)"/>
    </g>
    <g transform="translate(630 112)" filter="url(#shadow)">
      <rect width="520" height="200" rx="24" fill="#080d2b" fill-opacity=".76" stroke="#bd43ff" stroke-opacity=".7"/>
      <rect x="10" y="10" width="500" height="180" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".08"/>
      <path d="M24 25H210" stroke="url(#purple)" stroke-width="3"/>
      <text x="28" y="55" fill="#dc78ff" font-family="JetBrains Mono,Consolas,monospace" font-size="13" letter-spacing="2">02 / TOOL MESH</text>
      <text x="28" y="91" fill="#fffaff" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="750">CLI-MCP</text>
      <text x="28" y="122" fill="#c8c4df" font-family="Inter,Segoe UI,sans-serif" font-size="14">A governed gateway connecting AI clients to</text>
      <text x="28" y="143" fill="#c8c4df" font-family="Inter,Segoe UI,sans-serif" font-size="14">50+ CLI tools inside an isolated runtime.</text>
      <text x="28" y="174" fill="#f3cc72" font-family="JetBrains Mono,Consolas,monospace" font-size="11">FASTMCP  ·  PYTHON  ·  DOCKER</text>
      <path d="M438 46h42v32h-42z M447 55h24v14h-24z" fill="none" stroke="#d95aff" stroke-width="2"/>
      <circle cx="459" cy="62" r="4" fill="#f6cf6a" filter="url(#glow)"/>
    </g>

    <!-- row 2 -->
    <g transform="translate(50 352)" filter="url(#shadow)">
      <rect width="520" height="200" rx="24" fill="#080d2b" fill-opacity=".76" stroke="#bd43ff" stroke-opacity=".7"/>
      <rect x="10" y="10" width="500" height="180" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".08"/>
      <path d="M24 25H210" stroke="url(#purple)" stroke-width="3"/>
      <text x="28" y="55" fill="#dc78ff" font-family="JetBrains Mono,Consolas,monospace" font-size="13" letter-spacing="2">03 / GEO INTELLIGENCE</text>
      <text x="28" y="91" fill="#fffaff" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="750">RTAIP</text>
      <text x="28" y="122" fill="#c8c4df" font-family="Inter,Segoe UI,sans-serif" font-size="14">Public-source intelligence and open geodata</text>
      <text x="28" y="143" fill="#c8c4df" font-family="Inter,Segoe UI,sans-serif" font-size="14">fused into one operational map.</text>
      <text x="28" y="174" fill="#f3cc72" font-family="JetBrains Mono,Consolas,monospace" font-size="11">TYPESCRIPT  ·  MAPS  ·  OSINT</text>
      <circle cx="458" cy="62" r="25" fill="none" stroke="#d95aff" stroke-width="2"/>
      <path d="M458 38v48M434 62h48M441 48l34 28M475 48l-34 28" stroke="#f2c75f" stroke-opacity=".7"/>
    </g>
    <g transform="translate(630 352)" filter="url(#shadow)">
      <rect width="520" height="200" rx="24" fill="#080d2b" fill-opacity=".76" stroke="#f1be50" stroke-opacity=".66"/>
      <rect x="10" y="10" width="500" height="180" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".08"/>
      <path d="M24 25H210" stroke="url(#gold)" stroke-width="3"/>
      <text x="28" y="55" fill="#f5c85f" font-family="JetBrains Mono,Consolas,monospace" font-size="13" letter-spacing="2">04 / GOVERNED DELIVERY</text>
      <text x="28" y="91" fill="#fffaf0" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="750">Salesforce Delivery Agent</text>
      <text x="28" y="122" fill="#c8c4df" font-family="Inter,Segoe UI,sans-serif" font-size="14">BRD-to-deployment workflow with tests, CI/CD</text>
      <text x="28" y="143" fill="#c8c4df" font-family="Inter,Segoe UI,sans-serif" font-size="14">and explicit approval gates.</text>
      <text x="28" y="174" fill="#d69aff" font-family="JetBrains Mono,Consolas,monospace" font-size="11">SALESFORCE  ·  ACTIONS  ·  SDLC</text>
      <path d="M434 62l15 15 34-37" fill="none" stroke="#f7cc67" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    </g>

    <!-- row 3 -->
    <g transform="translate(50 592)" filter="url(#shadow)">
      <rect width="520" height="200" rx="24" fill="#080d2b" fill-opacity=".76" stroke="#f1be50" stroke-opacity=".66"/>
      <rect x="10" y="10" width="500" height="180" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".08"/>
      <path d="M24 25H210" stroke="url(#gold)" stroke-width="3"/>
      <text x="28" y="55" fill="#f5c85f" font-family="JetBrains Mono,Consolas,monospace" font-size="13" letter-spacing="2">05 / DEEP SKY</text>
      <text x="28" y="91" fill="#fffaf0" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="750">Skyshift</text>
      <text x="28" y="122" fill="#c8c4df" font-family="Inter,Segoe UI,sans-serif" font-size="14">SPHEREx observations transformed into an</text>
      <text x="28" y="143" fill="#c8c4df" font-family="Inter,Segoe UI,sans-serif" font-size="14">explorable time sequence of the sky.</text>
      <text x="28" y="174" fill="#d69aff" font-family="JetBrains Mono,Consolas,monospace" font-size="11">TYPESCRIPT  ·  SPHEREx  ·  VERCEL</text>
      <ellipse cx="458" cy="62" rx="34" ry="13" fill="none" stroke="#f4c75e" stroke-width="2" transform="rotate(-18 458 62)"/>
      <circle cx="458" cy="62" r="13" fill="#a933ff" opacity=".75" filter="url(#glow)"/>
    </g>
    <g transform="translate(630 592)" filter="url(#shadow)">
      <rect width="520" height="200" rx="24" fill="#080d2b" fill-opacity=".76" stroke="#bd43ff" stroke-opacity=".7"/>
      <rect x="10" y="10" width="500" height="180" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".08"/>
      <path d="M24 25H210" stroke="url(#purple)" stroke-width="3"/>
      <text x="28" y="55" fill="#dc78ff" font-family="JetBrains Mono,Consolas,monospace" font-size="13" letter-spacing="2">06 / DOCUMENT INTELLIGENCE</text>
      <text x="28" y="91" fill="#fffaff" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="750">Business Doc Analyzer</text>
      <text x="28" y="122" fill="#c8c4df" font-family="Inter,Segoe UI,sans-serif" font-size="14">AI-assisted extraction, analysis and creation</text>
      <text x="28" y="143" fill="#c8c4df" font-family="Inter,Segoe UI,sans-serif" font-size="14">of structured business documentation.</text>
      <text x="28" y="174" fill="#f3cc72" font-family="JetBrains Mono,Consolas,monospace" font-size="11">JAVASCRIPT  ·  LLMs  ·  STRUCTURE</text>
      <path d="M438 39h39l12 12v46h-51z M477 39v14h12 M447 67h31M447 78h31" fill="none" stroke="#d95aff" stroke-width="2"/>
    </g>

    <rect width="1200" height="870" rx="32" fill="none" stroke="url(#gold)" stroke-width="2"/>
  </g>
</svg>

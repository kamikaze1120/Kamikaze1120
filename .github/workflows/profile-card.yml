name: Profile card + snake

on:
  schedule:
    - cron: '30 0 * * *'   # daily, after the koi redraw
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_card.py'
      - 'assets/art.fragment'
      - '.github/workflows/profile-card.yml'

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild stats card from live GitHub data
        env:
          # Optional: add a PAT (scopes: read:user, repo) as the PROFILE_TOKEN
          # secret so private work is counted. Falls back to GITHUB_TOKEN.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_card.py

      - name: Commit card if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile card"
            git pull --rebase
            git push
          fi

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58a6ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore: update contribution snake'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
